version: '3.8'

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: synthos
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: synthos
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  backend:
    build: 
      context: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://synthos:changeme@database:5432/synthos
      - POSTGRES_USER=synthos
      - POSTGRES_PASSWORD=changeme
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
